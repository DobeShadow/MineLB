name: MineLeaderboards
version: '1.0.0'
main: com.dobeshadow.mineleaderboards.MineLeaderboardsPlugin
api-version: '1.20'
authors: ['DobeShadow']
description: '定时采集服务器财富/在线时长/决斗积分/签到数据并推送到 MineMC 排行榜端点'
softdepend: [Vault, PlaceholderAPI]
commands:
  mineleaderboards:
    description: 排行榜数据采集管理
    usage: /mineleaderboards <reload|push|test>
    aliases: [minelb, mlb]
    permission: mineleaderboards.admin
permissions:
  mineleaderboards.admin:
    description: 允许使用 /mineleaderboards 管理命令
    default: op
